name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to bump the version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="$(awk -F= '$1 == "mod_version" { sub(/\r$/, "", $2); print $2; exit }' gradle.properties)"
          base="${current%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
          sed -i "s/^mod_version=.*/mod_version=${version}/" gradle.properties
          if grep -q '^github_repo=' gradle.properties; then
            sed -i "s|^github_repo=.*|github_repo=${GITHUB_REPOSITORY}|" gradle.properties
          else
            printf '\ngithub_repo=%s\n' "$GITHUB_REPOSITORY" >> gradle.properties
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${current} -> ${version} (${BUMP})"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          ./gradlew test build autoupdateJar \
            :hello-extension:meowtilsArchive \
            :tenacity-gui:meowtilsArchive \
            :notifications:meowtilsArchive \
            :bed-plates:meowtilsArchive \
            :stats-faker:meowtilsArchive \
            --no-daemon

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          mkdir -p dist
          cp "build/libs/meowtils-${version}.jar" dist/
          cp build/libs/MeowtilsAutoUpdate.jar dist/
          extensions=(hello-extension tenacity-gui notifications bed-plates stats-faker)
          for name in "${extensions[@]}"; do
            src="examples/${name}/build/libs/${name}.meowtils"
            if [[ ! -s "$src" ]]; then
              echo "Missing built extension: $src" >&2
              exit 1
            fi
            cp "$src" dist/
          done
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meowtils-${{ steps.bump.outputs.version }}
          path: dist/*

      - name: Commit version and tag
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release ${version}"
          git tag "v${version}"
          git push origin HEAD
          git push origin "v${version}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          cat > /tmp/release-notes.md <<EOF
          Fabric client port of Meowtils for **Minecraft 26.2**.

          ## Mod

          - \`meowtils-${version}.jar\` — put this in your instance \`mods\` folder with Fabric Loader and Fabric API.
          - \`MeowtilsAutoUpdate.jar\` — helper used by Auto-Updates. Do **not** put it in \`mods\`.

          ## Example extensions

          These \`.meowtils\` archives were built against this exact Meowtils version. After the first launch, copy any of them into \`<minecraft>/meowtils/extensions/\` and restart (or \`/reload\` if the base mod is already this build).

          | File | What it is |
          | --- | --- |
          | \`hello-extension.meowtils\` | Starter example: settings, \`/hello\`, chat trigger, HUD |
          | \`tenacity-gui.meowtils\` | Floating panels, themes, search, original widgets (enabled by default) |
          | \`notifications.meowtils\` | Tenacity 5.0 and Vape V4 notification styles (enabled by default) |
          | \`bed-plates.meowtils\` | Projected bed-defense item plates (disabled by default) |
          | \`stats-faker.meowtils\` | Local Bedwars/network display changes (disabled by default) |

          Use these only with this Meowtils jar. Open the Click GUI with **Right Shift**.
          EOF
          gh release create "v${version}" \
            --title "Meowtils ${version}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            dist/*
