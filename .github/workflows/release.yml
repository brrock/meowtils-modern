name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to bump the version
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="$(awk -F= '$1 == "mod_version" { sub(/\r$/, "", $2); print $2; exit }' gradle.properties)"
          base="${current%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
          sed -i "s/^mod_version=.*/mod_version=${version}/" gradle.properties
          if grep -q '^github_repo=' gradle.properties; then
            sed -i "s|^github_repo=.*|github_repo=${GITHUB_REPOSITORY}|" gradle.properties
          else
            printf '\ngithub_repo=%s\n' "$GITHUB_REPOSITORY" >> gradle.properties
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${current} -> ${version} (${BUMP})"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test build autoupdateJar --no-daemon

      - name: Commit version and tag
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release ${version}"
          git tag "v${version}"
          git push origin HEAD
          git push origin "v${version}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          gh release create "v${version}" \
            --title "Meowtils ${version}" \
            --generate-notes \
            "build/libs/meowtils-${version}.jar" \
            "build/libs/MeowtilsAutoUpdate.jar"
