site_name: Meowtils Documentation
site_url: https://brrock.github.io/meowtils-modern/
site_description: Documentation for Meowtils on Minecraft 26.2 / Fabric.
site_author: brrock

theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/meowtils.png
  favicon: assets/meowtils.png
  features:
    - content.code.copy
    - navigation.footer
  
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
    tag:
      blatant: fontawesome/solid/skull
      legit: fontawesome/solid/check
      safe: fontawesome/solid/book

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - content.code.copy
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share

  palette:
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode

    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/color.css
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

plugins:
  - tags
  - glightbox
  - search

repo_url: https://github.com/brrock/meowtils-modern
repo_name: brrock/meowtils-modern

extra:
  generator: false
  tags:
    Blatant: blatant
    Legit: legit
    Safe: safe
  og_image: assets/meowtils.png
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brrock/meowtils-modern
      name: Meowtils Repository

